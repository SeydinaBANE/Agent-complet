[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.25",
    "openai>=1.30",           # OpenRouter is OpenAI-compatible
    "langgraph>=0.1",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "tenacity>=8.3",
    "structlog>=24.2",
    "prometheus-fastapi-instrumentator>=7.0",
    "duckduckgo-search>=6.1",
    "httpx>=0.27",
    "slowapi>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-redis",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["agentcore"]
omit = ["tests/*", "agentcore/db/migrations/*"]
