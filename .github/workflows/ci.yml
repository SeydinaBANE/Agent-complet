name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  agentcore:
    name: AgentCore (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agentcore_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: cd agentcore && pip install -r requirements-dev.txt

      - name: Lint
        run: cd agentcore && ruff check .

      - name: Format check
        run: cd agentcore && ruff format --check .

      - name: Type check
        run: cd agentcore && mypy agentcore/

      - name: Run migrations
        run: cd agentcore && alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/agentcore_test
          REDIS_URL: redis://localhost:6379
          OPENROUTER_API_KEY: test-key
          AGENTCORE_API_KEY: test-key

      - name: Tests
        run: cd agentcore && pytest --cov=agentcore --cov-fail-under=80 --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/agentcore_test
          REDIS_URL: redis://localhost:6379
          OPENROUTER_API_KEY: test-key
          AGENTCORE_API_KEY: test-key
          FLOWRUNNER_ORIGIN: http://localhost:5173

  flowrunner:
    name: FlowRunner (Node.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: flowrunner/server/package-lock.json

      - name: Install server deps
        run: cd flowrunner/server && npm ci

      - name: Lint
        run: cd flowrunner/server && npm run lint

      - name: Type check
        run: cd flowrunner/server && npm run typecheck

      - name: Tests
        run: cd flowrunner/server && npm test

      - name: Install client deps
        run: cd flowrunner/client && npm ci

      - name: Build client
        run: cd flowrunner/client && npm run build

  docker-build:
    name: Docker Build
    needs: [agentcore, flowrunner]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build
