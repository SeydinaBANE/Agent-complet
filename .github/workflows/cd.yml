name: CD

on:
  push:
    branches: [main]

jobs:
  push-images:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agentcore
        uses: docker/build-push-action@v5
        with:
          context: ./agentcore
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/agentcore:latest
            ghcr.io/${{ env.REPO_LOWER }}/agentcore:${{ github.sha }}

      - name: Build and push flowrunner
        uses: docker/build-push-action@v5
        with:
          context: ./flowrunner/server
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/flowrunner:latest
            ghcr.io/${{ env.REPO_LOWER }}/flowrunner:${{ github.sha }}
