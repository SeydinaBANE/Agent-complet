name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1" # every Monday at 8am UTC

jobs:
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Build agentcore image
        run: docker build -t agentcore-scan:latest ./agentcore

      - name: Scan agentcore
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentcore-scan:latest
          format: sarif
          output: trivy-agentcore.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload agentcore results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-agentcore.sarif
          category: trivy-agentcore

      - name: Build flowrunner image
        run: docker build -t flowrunner-scan:latest ./flowrunner/server

      - name: Scan flowrunner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flowrunner-scan:latest
          format: sarif
          output: trivy-flowrunner.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload flowrunner results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-flowrunner.sarif
          category: trivy-flowrunner
